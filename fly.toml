# fly.toml app configuration file generated for tm-api-fa-3va on 2026-10-22T18:32:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tm-api-fa-3va'
primary_region = 'sin'

[build]

[env]
  RATE_LIMITING_ENABLE = 'true'
  RATE_LIMITING_FREQUENCY = '2/3seconds'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
